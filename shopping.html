<!DOCTYPE html>
<html>
<head>
  
    <title>Online Shopping Store</title>
    <link rel="stylesheet" href="shopping.css">
</head>
<body>
    <h1>QuickShop Store</h1>
    <div class="grid">
        <div class="card">
            <h3>Wireless Headphones</h3>
            <p>High quality sound with deep bass.</p>
            <div class="price">Rs. 1,999</div>
            <button>Add to Cart</button>
        </div>
        <div class="card">
            <h3>Smart Watch</h3>
            <p>Track your daily fitness goals.</p>
            <div class="price">Rs. 2,999</div>
            <button>Add to Cart</button>
        </div>
        <div class="card">
            <h3>Running Shoes</h3>
            <p>Comfortable sports shoes for daily use.</p>
            <div class="price">Rs. 1,499</div>
            <button>Add to Cart</button>
        </div>
    </div>
</body>
</html>
