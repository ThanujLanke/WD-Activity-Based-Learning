<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Ordering Portal</title>
    <link rel="stylesheet" href="food_ordering.css">
</head>
<body>
    <h1>Delicious Bites Food Delivery</h1>
    <div class="menu">
        <div class="item">
            <h3>Cheese Pizza</h3>
            <p>Loaded with extra mozzarella cheese.</p>
            <div class="price">Rs. 299</div>
            <button>Order Now</button>
        </div>
        <div class="item">
            <h3>Veg Burger</h3>
            <p>Crispy patty with fresh lettuce and mayo.</p>
            <div class="price">Rs. 149</div>
            <button>Order Now</button>
        </div>
        <div class="item">
            <h3>Chocolate Brownie</h3>
            <p>Rich and fudgy chocolate dessert.</p>
            <div class="price">Rs. 120</div>
            <button>Order Now</button>
        </div>
    </div>
</body>
</html>
